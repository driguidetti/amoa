<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amoá - Perfumaria Artesanal</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        :root {
            --cor-principal: #b2c2b1;
            --cor-secundaria: #b58866;
            --cor-complementar: #ddd5ca;
            --cor-texto: #333333;
            --cor-fundo: #faf9f7;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Arial', sans-serif; }
        body { background-color: var(--cor-fundo); color: var(--cor-texto); }

        .header {
            background-color: var(--cor-complementar);
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .logo { height: 50px; }
        .nav-menu { display: none; gap: 15px; }
        .nav-btn { background: none; border: none; font-weight: bold; cursor: pointer; padding: 5px 10px; }
        .nav-btn:hover { color: var(--cor-secundaria); }
        
        .cart-container { position: relative; cursor: pointer; color: var(--cor-secundaria); }
        .cart-icon { font-size: 32px; }
        #cart-count {
            position: absolute; top: -5px; right: -10px;
            background-color: var(--cor-principal); color: white;
            font-size: 12px; padding: 2px 6px; border-radius: 50%;
        }

        .hero-banner { background-color: var(--cor-principal); color: white; text-align: center; padding: 4rem 1rem; }
        .products-grid { display: grid; grid-template-columns: 1fr; gap: 20px; padding: 20px; max-width: 1200px; margin: 0 auto; }
        .product-card { background: white; padding: 15px; border-radius: 8px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .product-card button { background-color: var(--cor-principal); color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; margin-top: 10px; width: 100%; }
        
        .whatsapp-float {
            position: fixed; bottom: 20px; right: 20px;
            background-color: #25D366; color: white; font-size: 35px;
            padding: 10px; border-radius: 50%; z-index: 1000; text-decoration: none;
        }

        .footer { background-color: var(--cor-secundaria); color: white; text-align: center; padding: 20px; margin-top: 40px; }
        .murphy-signature { margin-top: 15px; font-size: 0.9rem; opacity: 0.8; }

        @media (min-width: 768px) {
            .nav-menu { display: flex; }
            .products-grid { grid-template-columns: repeat(3, 1fr); }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo-container">
            <img src="LOGOTIPO - PREFERÊNCIAL.png" alt="Amoá Perfumaria" class="logo">
        </div>
        <nav class="nav-menu">
            <button class="nav-btn">Home Sprays</button>
            <button class="nav-btn">Sabonetes</button>
            <button class="nav-btn">Cremes</button>
            <button class="nav-btn">Kits</button>
        </nav>
        <div class="cart-container" onclick="abrirCarrinho()">
            <i class="ph ph-basket cart-icon"></i>
            <span id="cart-count">0</span>
        </div>
    </header>

    <section class="hero-banner" id="banner-container">
        <h1>Descubra a essência do cuidado artesanal</h1>
        <p>Aromas que transformam o seu ambiente.</p>
    </section>

    <main class="products-grid" id="products-container">
        <!-- Produtos serão renderizados aqui -->
    </main>

    <a href="https://wa.me/SEUNUMERO" class="whatsapp-float" target="_blank">
        <i class="ph-fill ph-whatsapp-logo"></i>
    </a>

    <footer class="footer">
        <p class="murphy-signature">Criado pela Murphy Company</p>
    </footer>

    <script type="module">
        // Configuração do Supabase (Substitua pelas suas chaves posteriormente)
        const supabaseUrl = 'SUA_URL_DO_SUPABASE';
        const supabaseKey = 'SUA_CHAVE_ANON_DO_SUPABASE';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        let carrinho = JSON.parse(localStorage.getItem('carrinhoAmoa')) || [];

        function atualizarCarrinho() {
            document.getElementById('cart-count').innerText = carrinho.length;
            localStorage.setItem('carrinhoAmoa', JSON.stringify(carrinho));
        }

        window.adicionarAoCarrinho = function(id, nome, preco) {
            carrinho.push({ id, nome, preco });
            atualizarCarrinho();
            alert(`${nome} adicionado à sua cesta!`);
        };

        window.abrirCarrinho = function() {
            if(carrinho.length === 0) {
                alert("Sua cesta está vazia.");
            } else {
                alert(`Você tem ${carrinho.length} itens na cesta. Redirecionando para o checkout...`);
                // Aqui integraremos a lógica de checkout futuramente
            }
        };

        // Renderização simulada para a vitrine inicial
        async function carregarProdutos() {
            const container = document.getElementById('products-container');
            
            // Simulação antes de conectar ao banco real
            const produtosMock = [
                { id: 1, nome: "Home Spray Lavanda", preco: 45.90 },
                { id: 2, nome: "Sabonete Argila Branca", preco: 22.50 },
                { id: 3, nome: "Kit Spa em Casa", preco: 89.90 }
            ];

            container.innerHTML = produtosMock.map(prod => `
                <div class="product-card">
                    <h3>${prod.nome}</h3>
                    <p>R$ ${prod.preco.toFixed(2).replace('.', ',')}</p>
                    <button onclick="adicionarAoCarrinho(${prod.id}, '${prod.nome}', ${prod.preco})">Adicionar à Cesta</button>
                </div>
            `).join('');
        }

        atualizarCarrinho();
        carregarProdutos();
    </script>
</body>
</html>
